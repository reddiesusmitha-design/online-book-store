<!DOCTYPE html>
<html>
<head>
    <title>Ecommerce Website</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🛍️ My Ecommerce Store</h1>

    <nav>
        <a href="#home.html">Home</a>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="#products.html">products</a>
        <a href="signup.html">signup</a>
        <a href="#cart">cart</a>
        <a href="checkout.html">checkout</a>
    </nav>
</header>

<section id="home" class="hero">
    <h2>Welcome to Our Store</h2>
    <div>
    <label>Maximum Price:</label>

    <input
        type="number"
        id="maxPrice"
        placeholder="Enter price"
    >

    <button onclick="filterProducts()">Filter</button>
</div>
    <p>Quality products at affordable prices</p>
    <button onclick="showProducts()">Shop Now</button>
</section>

<section id="products">
    <h2>Our Products</h2>

    <div class="products">

        <div class="product"data-price="999">
            <h3>Smart Watch</h3>
            <p>₹999</p>
            <button onclick="addToCart('Smart Watch', 999)">
                Add to Cart
            </button>
        </div>

        <div class="product"data-price="799">
            <h3>Headphones</h3>
            <p>₹799</p>
            <button onclick="addToCart('Headphones', 799)">
                Add to Cart
            </button>
        </div>

        <div class="product"data-price="599">
            <h3>Backpack</h3>
            <p>₹599</p>
            <button onclick="addToCart('Backpack', 599)">
                Add to Cart
            </button>
        </div>

    </div>
</section>

<section id="cart">
    <button onclick="logout()">logout</button>
    <h2>Shopping Cart</h2>
    <p id="cartItems">Cart is empty</p>
    <h3 id="total">Total: ₹0</h3>
    <button onclick="window.location.href='checkout.html'"proceed to checkout</button>
</section>

<section id="login">
    <h2>Login</h2>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">

    <br><br>

    <button onclick="login()">login</button>
</section>

<footer>
    <p>© 2026 My Ecommerce Website</p>
</footer>

<script src="script.js"></script>

</body>
</html>
